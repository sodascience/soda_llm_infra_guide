name: Weekly External Link Check
run-name: Weekly External Link Check (${{ github.event_name }})

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee (external URLs only)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --timeout 20
            --scheme http
            --scheme https
            --format markdown
            --output lychee-report.md
            docs mkdocs.yml

      - name: Create or update issue with broken links
        uses: actions/github-script@v7
        env:
          LYCHEE_OUTCOME: ${{ steps.lychee.outcome }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueTitle = 'Weekly link check: broken external URLs';
            const issueLabel = 'broken-links';
            const reportPath = 'lychee-report.md';
            const hasFailures = process.env.LYCHEE_OUTCOME === 'failure';

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: issueLabel });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: issueLabel,
                    color: 'B60205',
                    description: 'Broken external links detected by weekly check',
                  });
                } else {
                  throw error;
                }
              }
            }

            async function findOpenIssue() {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                labels: issueLabel,
                per_page: 100,
              });

              return issues.find((issue) => issue.title === issueTitle) || null;
            }

            await ensureLabel();
            const existing = await findOpenIssue();

            if (hasFailures) {
              const report = fs.existsSync(reportPath)
                ? fs.readFileSync(reportPath, 'utf8')
                : 'Lychee reported failures, but no report file was found.';

              const timestamp = new Date().toISOString();
              const maxBodyLength = 60000;
              const trimmedReport = report.length > maxBodyLength
                ? report.slice(0, maxBodyLength) + '\n\n...report truncated...'
                : report;

              const body = [
                `Detected broken links in weekly scan.`,
                '',
                `- Checked at: ${timestamp}`,
                `- Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                '## Lychee report',
                '',
                trimmedReport,
              ].join('\n');

              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: issueTitle,
                  body,
                  labels: [issueLabel],
                });
              }
            } else if (existing) {
              const comment = [
                'No broken external links were found in the latest weekly run.',
                '',
                `Workflow run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: comment,
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
